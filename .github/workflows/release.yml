name: Release

# Manual only, with a typed confirmation, not on tag push: a stray tag must not publish
# a signed public binary.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (no leading v)'
        required: true
      confirm:
        description: 'Type RELEASE to confirm (case-sensitive)'
        required: true

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate confirm input
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RELEASE" ]; then
            echo "::error::confirm input must be exactly 'RELEASE' to proceed."
            exit 1
          fi

      - name: Release only from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi

      # Fail fast, before the ~10-minute build, if this version is already published.
      - name: Guard against re-releasing an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released on $GITHUB_REPOSITORY."
            exit 1
          fi

  # Tarball names follow cargo-binstall's layout; binstall needs a crates.io publish (not yet).
  build-linux:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Build (static musl)
        run: cross build --release --locked --target "$TARGET"

      # x86_64 reports "static-pie linked", aarch64 "statically linked".
      - name: Check the binary is static (and runs on x86_64)
        run: |
          f="target/$TARGET/release/nemonik"
          file "$f"
          file "$f" | grep -qE 'statically linked|static-pie linked' || { echo "::error::nemonik is not statically linked"; exit 1; }
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then "$f" --version; fi

      - name: Package + checksum
        run: |
          name="nemonik-$TARGET-v$VERSION"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/nemonik" "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" && cat "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # Nothing publishes until both platforms have built. Recovery for a failed publish
  # job: "Re-run failed jobs" on the same run.
  publish:
    needs: [build-linux, build-sign-notarize-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "v$VERSION" \
            *.tar.gz *.zip *.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "nemonik v$VERSION: static Linux binaries (x86_64 + aarch64) and a signed, notarized universal macOS binary. macOS: brew install mitchldtn/tap/nemonik."

  build-sign-notarize-macos:
    needs: preflight
    runs-on: macos-14
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build both arches
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Merge into a universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/nemonik \
            target/aarch64-apple-darwin/release/nemonik \
            target/x86_64-apple-darwin/release/nemonik
          lipo -info dist/nemonik

      # Import the Developer ID cert into a throwaway keychain scoped to this job.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign the universal binary
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force \
            --sign "Developer ID Application: Antepost LLC ($APPLE_TEAM_ID)" \
            --options runtime --timestamp \
            --identifier io.nemonik.cli \
            dist/nemonik
          codesign --verify --deep --strict --verbose=2 dist/nemonik

      # ditto (not zip) keeps the signature's xattrs. No stapling: Gatekeeper checks a
      # bare Mach-O's ticket online. (`spctl -a --type execute` false-negatives on a bare
      # Mach-O; it targets .app bundles.)
      - name: Notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --keepParent dist "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Package + checksum
        run: |
          cd dist
          ditto -c -k --keepParent nemonik nemonik.zip
          shasum -a 256 nemonik.zip > nemonik.zip.sha256
          cat nemonik.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.zip.sha256

  update-formula:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Update the Homebrew formula
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/mitchldtn/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"

          SHA=$(cut -d ' ' -f1 dist/nemonik.zip.sha256)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"

          cat > "$TAP_DIR/Formula/nemonik.rb" <<EOF
          class Nemonik < Formula
            desc "Package how your team works into kits you share and refine: the system prompt, skills, MCP servers and hooks for planning, coding and reviewing"
            homepage "https://nemonik.io"
            url "${BASE}/nemonik.zip"
            sha256 "${SHA}"
            version "${VERSION}"

            depends_on "tmux"

            def install
              bin.install "nemonik"
              # Short alias for day-to-day typing -- both \`nemonik\` and \`nk\`
              # resolve to the same binary.
              bin.install_symlink "nemonik" => "nk"
            end

            test do
              system "#{bin}/nemonik", "--version"
              system "#{bin}/nk", "--version"
            end
          end
          EOF

          cd "$TAP_DIR"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/
          git diff --cached --quiet || git commit -m "nemonik $VERSION"
          git push
